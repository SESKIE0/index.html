<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memory Gallery | 30 Days of Us</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fcf9f5;
            --card-bg: #ffffff;
            --text-main: #2c2a29;
            --text-muted: #6b6764;
            --accent-gold: #c5a059;
            --accent-rose: #d4a373;
            --border-color: #eae1d7;
            --shadow: 0 10px 30px rgba(44, 42, 41, 0.05);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle background art elements */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.4;
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5s;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Test Mode Toggle Bar */
        .control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--card-bg);
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .control-bar label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-bar input[type="checkbox"] {
            accent-color: var(--accent-gold);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        .day-card:hover:not(.locked) {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 35px rgba(197, 160, 89, 0.15);
        }

        .day-card.locked {
            background: #f7f4ef;
            opacity: 0.7;
            cursor: not-allowed;
        }

        .day-card .day-number {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.3rem;
        }

        .day-card .day-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .day-card .lock-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            color: var(--accent-rose);
            font-size: 0.9rem;
        }

        .day-card.unlocked::after {
            content: '';
            position: absolute;
            bottom: 10px;
            width: 6px;
            height: 6px;
            background-color: var(--accent-gold);
            border-radius: 50%;
        }

        /* Modal / Popup View */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 42, 41, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            position: relative;
            transform: scale(0.95);
            transition: var(--transition);
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--accent-gold);
            color: white;
            border-color: var(--accent-gold);
        }

        .modal-header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .modal-header span {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--text-main);
            margin-top: 0.3rem;
        }

        .modal-image-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
            border: 4px solid #fff;
        }

        .modal-image-container img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            display: block;
        }

        .modal-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-main);
            margin-bottom: 2rem;
            white-space: pre-line;
            background: #faf7f2;
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid var(--accent-gold);
            font-style: italic;
        }

        /* Settings Drawer Button */
        .settings-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--text-main);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 99;
            transition: var(--transition);
            border: none;
        }

        .settings-btn:hover {
            transform: rotate(45deg);
            background: var(--accent-gold);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Our Memory Gallery</h1>
            <p>30 Days of reliving our most cherished moments together</p>
        </header>

        <!-- Control Bar for Testing -->
        <div class="control-bar">
            <label>
                <input type="checkbox" id="testModeToggle" onchange="toggleTestMode()"> 
                <span>Unlock All Days (Preview Mode)</span>
            </label>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery-grid" id="galleryGrid">
            <!-- Dynamically generated cards will appear here -->
        </div>
    </div>

    <!-- Modal View -->
    <div class="modal-overlay" id="dayModal" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="modal-header">
                <span id="modalDaySubtitle">Day 1</span>
                <h2 id="modalDayTitle">Our First Memory</h2>
            </div>
            <div class="modal-image-container" id="modalImageContainer">
                <img id="modalImage" src="" alt="Memory Image">
            </div>
            <div class="modal-text" id="modalQuote">
                <!-- Day content goes here -->
            </div>
        </div>
    </div>

    <!-- Settings / Edit Button -->
    <button class="settings-btn" onclick="openSettings()" title="Settings">
        <i class="fa-solid fa-gear"></i>
    </button>

    <script>
        // Start Date of the journey (Change this if needed, format YYYY-MM-DD)
        const startDate = "2026-10-01"; 

        // 30 Days Data Structure (Day 1 filled with your English message and photos)
        const defaultDaysData = [
            {
                day: 1,
                title: "The Graduation Day",
                date: "2026-10-01",
                image: "https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1000&auto=format&fit=crop", // Default placeholder, can be replaced with your image link
                quote: `Hello, my soulmate. \n\nFor the past week, I've had a new idea in mind: to relive our cherished memories and contemplate them together. That’s why I created this website. Over the coming days, I’ll try to bring back a beautiful memory we shared—to tell you why I adore that day, what I love about you, and what made that moment so special to me.\n\nThis particular day holds a truly extraordinary place in my heart. I will never forget, my love, having you right beside me during my graduation as we received my certificate together. I can’t even begin to describe how much I love you, how special that day was, or how deeply synchronized and in love we felt. In those moments, I felt so alive—capable of feeling every beautiful emotion—and so complete simply because you were by my side.\n\nJust one glance from you makes me the happiest person alive. A single word from you brings me warmth and peace. And an embrace from you makes me feel as though I need nothing else from this world.\n\nI love you with a pure, deep love—I adore you, and I am head over heels for you.\n\nI still remember that day down to every tiny detail: how we went to Helwan, headed back to Maadi, where we ate, and what we drank. I love you with a love beyond words—a love so pure, so real, and endless.\n\nThis was the very first day of attempting to live through our memories, document them, and describe my true feelings for you, my soulmate.`
            },
            // Days 2 to 30 placeholders
            ...Array.from({length: 29}, (_, index) => ({
                day: index + 2,
                title: `Memory Day ${index + 2}`,
                date: `2026-10-${String(index + 2).padStart(2, '0')}`,
                image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1000&auto=format&fit=crop",
                quote: `Coming soon... Another beautiful memory to share with you on Day ${index + 2}.`
            }))
        ];

        // Load data from localStorage or use default
        let daysData = JSON.parse(localStorage.getItem('romanticGalleryData')) || defaultDaysData;

        let testMode = false;

        function toggleTestMode() {
            testMode = document.getElementById('testModeToggle').checked;
            renderGallery();
        }

        function getDaysDifference(dateStr) {
            const start = new Date(dateStr);
            const today = new Date();
            // Reset time part for accurate day calculation
            start.setHours(0,0,0,0);
            today.setHours(0,0,0,0);
            const diffTime = today - start;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            const currentDayIndex = getDaysDifference(startDate);

            daysData.forEach((item, index) => {
                const card = document.createElement('div');
                
                // Unlocked condition: test mode is active OR day number is <= elapsed days + 1
                const isUnlocked = testMode || (index <= currentDayIndex);

                card.className = `day-card ${isUnlocked ? 'unlocked' : 'locked'}`;
                
                let html = `
                    <div class="day-number">${item.day}</div>
                    <div class="day-label">Day</div>
                `;

                if (!isUnlocked) {
                    html += `<i class="fa-solid fa-lock lock-icon"></i>`;
                    card.onclick = () => alert("This memory is locked until its specific day arrives! ❤️ (Or you can check 'Unlock All Days' above to preview).");
                } else {
                    card.onclick = () => openDayModal(item.day);
                }

                card.innerHTML = html;
                grid.appendChild(card);
            });
        }

        function openDayModal(dayNum) {
            const item = daysData.find(d => d.day === dayNum);
            if (!item) return;

            document.getElementById('modalDaySubtitle').innerText = `Day ${item.day} • ${item.date}`;
            document.getElementById('modalDayTitle').innerText = item.title;
            document.getElementById('modalImage').src = item.image;
            document.getElementById('modalQuote').innerText = item.quote;

            document.getElementById('dayModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('dayModal').classList.remove('active');
        }

        function closeModalOnOutside(event) {
            if (event.target.id === 'dayModal') {
                closeModal();
            }
        }

        function openSettings() {
            const newTitle = prompt("Enter a custom title for the gallery:", "Our Memory Gallery");
            if (newTitle) {
                document.querySelector('header h1').innerText = newTitle;
            }
        }

        // Initial render on load
        renderGallery();
    </script>
</body>
</html>
